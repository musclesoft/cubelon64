MEMORY {
    ZP:     start = $02,    size = $FD, type = rw, define = yes;
    ZPFF:   start = $FF,    size = $01, type = rw;
    FFA5:   start = $FFA5,  size = $01, type = rw;
    HEADER: start = $0000,  size = $0002, file = %O, fill = yes;
    RAM1:   start = $0801,  size = $37FF, file = %O;  # Before VIC bank II
    # VIC bank II ($4000-$7FFF) reserved for graphics
    RAM2:   start = $8000,  size = $0800, file = %O;  # After VIC bank II: scene data
    HIGH:   start = $E000,  size = $1FA5, type = rw;  # Under the KERNAL ROM, banked out; ends before the FFA5 variable
    TILES:  start = $8800,  size = $4800;             # Tile pages of the scenes, below the I/O area
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    ZEROPAGE: load = ZP, type = zp;
    ZPFF:     load = ZPFF, type = zp;
    FFA5:     load = FFA5, type = bss;
    CODE:     load = RAM1, type = ro;
    RODATA:   load = RAM1, type = ro;
    DATA:     load = RAM1, type = rw;
    BSS:      load = HIGH, type = bss, define = yes, align = 256;
    SCRATCH:  load = TILES, type = bss;
    MORPH:    load = TILES, type = bss, align = 256;
    SPIN:     load = TILES, type = bss, align = 256;
    SPINDATA: load = RAM2, type = ro;
    SPLIT:    load = TILES, type = bss, align = 256;
    DIAMOND:  load = HIGH, type = bss;
    DIAMOND_TILES: load = TILES, type = bss;
}
