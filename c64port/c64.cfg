MEMORY {
    ZP:     start = $02,    size = $FD, type = rw, define = yes;
    ZPFF:   start = $FF,    size = $01, type = rw;
    FFA5:   start = $FFA5,  size = $01, type = rw;
    HEADER: start = $0000,  size = $0002, file = %O, fill = yes;
    RAM1:   start = $0801,  size = $37FF, file = %O;  # Before VIC bank II
    # VIC bank II ($4000-$7FFF) reserved for graphics
    FLOWERB: start = $4400, size = $03F8, file = %O;  # Screen B holds only its sprite pointers: the flower renderer
    FLOWERH: start = $5D00, size = $0300, file = %O;  # Free cube code memory: the flower's builds
    FLOWERF: start = $6900, size = $0100, file = %O;  # Free VIC bank RAM: more of the flower renderer
    FLOWERD: start = $4C00, size = $03F8, file = %O;  # Screen D likewise
    CUBECODE: start = $5000, size = $0D00, file = %O; # Free VIC bank RAM: the cube scene's code, then flower pieces
    CUBEROM:  start = $6A00, size = $0400, file = %O; # Free VIC bank RAM: the cube scene's vertices
    CUBERAM:  start = $6E00, size = $0A00;            # Free VIC bank RAM: the cube scene's variables and delay line of chars
    CUBESPR:  start = $7800, size = $0800;            # Free VIC bank RAM: the cube scene's sprite blocks
    RAM2:   start = $8000,  size = $0800, file = %O;  # After VIC bank II: scene data
    HIGH:   start = $E000,  size = $1FA5, type = rw;  # Under the KERNAL ROM, banked out; ends before the FFA5 variable
    TILES:  start = $8800,  size = $4800;             # Tile pages of the scenes, below the I/O area
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    ZEROPAGE: load = ZP, type = zp;
    ZPFF:     load = ZPFF, type = zp;
    FFA5:     load = FFA5, type = bss;
    CODE:     load = RAM1, type = ro;
    EARLYCODE: load = RAM1, type = ro;
    RODATA:   load = RAM1, type = ro;
    DATA:     load = RAM1, type = rw;
    BSS:      load = HIGH, type = bss, define = yes, align = 256;
    SCRATCH:  load = TILES, type = bss;
    MORPH:    load = TILES, type = bss, align = 256;
    SPIN:     load = TILES, type = bss, align = 256;
    SPINDATA: load = RAM2, type = ro;
    TILEDATA: load = RAM2, type = ro;
    FLOWERDATA: load = RAM2, type = ro;
    DISSOLVEDATA: load = RAM2, type = ro;
    FLOWERDATA2: load = FLOWERB|FLOWERD|CUBECODE|FLOWERH|FLOWERF|CUBEROM|RAM1|RAM2, type = ro;

    # The flower code and data: pieces the assembler packs into the gaps of the VIC bank (and RAM1), largest first
    FLOWER01: load = FLOWERB|FLOWERD|CUBECODE|FLOWERH|FLOWERF|CUBEROM|RAM1|RAM2, type = ro;
    FLOWER02: load = FLOWERB|FLOWERD|CUBECODE|FLOWERH|FLOWERF|CUBEROM|RAM1|RAM2, type = ro;
    FLOWER03: load = FLOWERB|FLOWERD|CUBECODE|FLOWERH|FLOWERF|CUBEROM|RAM1|RAM2, type = ro;
