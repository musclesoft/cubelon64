MEMORY {
    ZP:     start = $02,    size = $FD, type = rw, define = yes;
    ZPFF:   start = $FF,    size = $01, type = rw;
    FFA5:   start = $FFA5,  size = $01, type = rw;
    HEADER: start = $0000,  size = $0002, file = %O, fill = yes;
    RAM1:   start = $0801,  size = $37FF, file = %O;  # Before VIC bank II
    # VIC bank II ($4000-$7FFF) reserved for graphics
    RAM2:   start = $8000,  size = $2000, file = %O;  # After VIC bank II
}

SEGMENTS {
    LOADADDR: load = HEADER, type = ro;
    ZEROPAGE: load = ZP, type = zp;
    ZPFF:     load = ZPFF, type = zp;
    FFA5:     load = FFA5, type = bss;
    CODE:     load = RAM1, type = ro;
    RODATA:   load = RAM1, type = ro;
    DATA:     load = RAM1, type = rw;
    BSS:      load = RAM1, type = bss, define = yes, align = 256;
    MORPH:    load = RAM2, type = bss, align = 256;
}
