# C64 memory configuration for CUBELON demo
# Simplified cc65 linker configuration

MEMORY {
    # Zero page
    ZP:       file = "", start = $0002, size = $001A, type = rw;

    # Load address + BASIC stub + code
    MAIN:     file = %O, start = $0801, size = $A000 - $0801;

    # Demo data area
    DATA:     file = %O, start = $A000, size = $2000;

    # BSS (uninitialized data) - not in file
    BSS:      file = "", start = $C000, size = $1000;
}

SEGMENTS {
    LOADADDR: load = MAIN, type = ro;
    EXEHDR:   load = MAIN, type = ro;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = DATA, type = rw;
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = BSS,  type = bss;
}
