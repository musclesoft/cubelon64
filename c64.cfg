# C64 memory configuration for CUBELON demo
# cc65 linker configuration

FEATURES {
    STARTADDRESS: default = $0801;
}

SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800; # 2K stack
}

MEMORY {
    # Zero page
    ZP:       file = "", start = $0002, size = $001A, type = rw, define = yes;

    # BASIC load address
    LOADADDR: file = %O, start = $0801 - 2, size = $0002;

    # Main program area
    HEADER:   file = %O, start = $0801, size = $000C;
    CODE:     file = %O, start = $080D, size = $A000 - $080D;

    # Demo data area (after code)
    DATA:     file = %O, start = $A000, size = $2000;

    # BSS (uninitialized data) - not in file
    BSS:      file = "", start = $C000, size = $1000, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = CODE,     type = ro;
    LOWCODE:  load = CODE,     type = ro, optional = yes;
    CODE:     load = CODE,     type = ro;
    RODATA:   load = CODE,     type = ro;
    DATA:     load = CODE,     run = DATA, type = rw, define = yes;
    ZEROPAGE: load = ZP,       type = zp;
    BSS:      load = BSS,      type = bss, define = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
