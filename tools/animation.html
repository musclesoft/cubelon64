<!DOCTYPE html>
<html>
<head>
    <title>CUBELON Part 2 - Full Animation</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #0ff;
        }
        canvas {
            border: 2px solid #0f0;
            background: #000;
            image-rendering: pixelated;
            margin: 20px 0;
        }
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin: 20px 0;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="range"] {
            width: 400px;
        }
        button {
            background: #002200;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }
        button:hover {
            background: #004400;
        }
        .info {
            color: #ff0;
            font-size: 18px;
        }
        .status {
            margin: 10px 0;
            color: #0ff;
        }
    </style>
</head>
<body>
    <h1>CUBELON Part 2 - Square Emergence Animation</h1>
    <div class="status">52 frames extracted (Frames 319-370)</div>

    <canvas id="canvas" width="480" height="240"></canvas>

    <div class="controls">
        <button id="play">Play</button>
        <button id="prev">◀ Prev</button>
        <div class="slider-container">
            <input type="range" id="slider" min="0" max="51" value="0">
            <span class="info" id="frameInfo">Frame 319</span>
        </div>
        <button id="next">Next ▶</button>
    </div>

    <div class="info">Use slider to step through animation or click Play</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('slider');
        const frameInfo = document.getElementById('frameInfo');
        const playBtn = document.getElementById('play');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');

        let frames = [];
        let currentFrame = 0;
        let playing = false;
        let playInterval = null;
        const scale = 20;  // 20 pixels per pixel

        // Load animation data
        fetch('animation_frames_319-370.json')
            .then(response => response.json())
            .then(data => {
                frames = data;
                slider.max = frames.length - 1;

                // Resize canvas based on actual data
                if (frames.length > 0) {
                    const height = frames[0].pixels.length;
                    const width = frames[0].pixels[0].length;
                    canvas.width = width * scale;
                    canvas.height = height * scale;
                }

                drawFrame(0);
            });

        function drawFrame(index) {
            if (!frames[index]) return;

            const frame = frames[index];
            currentFrame = index;

            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw pixels (variable size)
            const height = frame.pixels.length;
            const width = frame.pixels[0].length;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    if (frame.pixels[y][x]) {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x * scale, y * scale, scale, scale);
                    }
                }
            }

            // Draw grid
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let x = 0; x <= width; x++) {
                ctx.beginPath();
                ctx.moveTo(x * scale, 0);
                ctx.lineTo(x * scale, height * scale);
                ctx.stroke();
            }
            for (let y = 0; y <= height; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * scale);
                ctx.lineTo(width * scale, y * scale);
                ctx.stroke();
            }

            frameInfo.textContent = `Frame ${frame.frame} (${index + 1}/${frames.length})`;
            slider.value = index;
        }

        // Slider control
        slider.addEventListener('input', (e) => {
            drawFrame(parseInt(e.target.value));
        });

        // Play/Pause
        playBtn.addEventListener('click', () => {
            playing = !playing;
            playBtn.textContent = playing ? 'Pause' : 'Play';

            if (playing) {
                playInterval = setInterval(() => {
                    currentFrame = (currentFrame + 1) % frames.length;
                    drawFrame(currentFrame);
                }, 1000 / 25);  // 25 fps
            } else {
                clearInterval(playInterval);
            }
        });

        // Previous frame
        prevBtn.addEventListener('click', () => {
            currentFrame = (currentFrame - 1 + frames.length) % frames.length;
            drawFrame(currentFrame);
        });

        // Next frame
        nextBtn.addEventListener('click', () => {
            currentFrame = (currentFrame + 1) % frames.length;
            drawFrame(currentFrame);
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevBtn.click();
            } else if (e.key === 'ArrowRight') {
                nextBtn.click();
            } else if (e.key === ' ') {
                e.preventDefault();
                playBtn.click();
            }
        });
    </script>
</body>
</html>
